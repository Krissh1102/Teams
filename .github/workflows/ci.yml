name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest        # Docker is preinstalled: Testcontainers starts a real PostgreSQL
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + API + concurrency tests
        run: mvn -B verify
      - name: Race test x10 (flakiness guard)
        run: |
          for i in $(seq 1 10); do
            echo "=== race run $i ==="
            mvn -B -q -Dtest=ConcurrencyIT test || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: backend/target/surefire-reports }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build        # includes strict TypeScript type-check
