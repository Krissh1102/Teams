
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamformation
      POSTGRES_USER: teamformation
      POSTGRES_PASSWORD: teamformation
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamformation -d teamformation"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/teamformation
      DB_USER: teamformation
      DB_PASSWORD: teamformation
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ARENA_ENABLED: "true"            
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
