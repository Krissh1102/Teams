server:
  port: ${PORT:8080}
  forward-headers-strategy: native 
spring:
  application:
    name: team-formation
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/teamformation}
    username: ${DB_USER:teamformation}
    password: ${DB_PASSWORD:teamformation}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-ttl-minutes: 1440
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  invite-ttl-hours: 48
  arena:
    enabled: ${ARENA_ENABLED:false} 
  rate-limit:
    enabled: true
    auth-per-minute-per-ip: 30
    join-per-minute-per-user: 10
    join-per-minute-per-ip: 60
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
